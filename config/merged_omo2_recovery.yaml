%YAML:1.0

# Loop closure / pose graph
imu: 1
output_path: "/tmp/omo2_recovery/"
load_previous_pose_graph: 0
pose_graph_save_path: "/tmp/omo2_recovery/pose_graph/"
save_image: 1
recall_ignore_recent_ct: 75
min_score: 0.030
pnp_inflation: 10.0
max_theta_diff: 170.0
max_pos_diff: 1.5
min_loop_feat_num: 20
skip_dist: 0.02
skip_cnt: 0

# Default target origin. Launch parameters override these with the measured
# initial world pose for each experiment.
initial_world_position: [0.0, 0.0, 0.0]
initial_world_yaw_deg: 0.0

# UWB-assisted stitching of omo2's post-restart local trajectory.
robot_name: "omo2"
distance_topic: "/group1/structure_distances"
distance_global_frame: "global"
distance_use_header_timestamps: 1
distance_sigma: 0.15
distance_max_value: 50.0
distance_max_age: 8.0

# Image stamps in the merged recordings lag bag/UWB time by roughly 0.13--0.26 s.
distance_sync_tolerance: 0.30
distance_sample_interval: 0.05

# Visual recovery has priority.  If it cannot close a loop in this interval,
# the validated range-only solution may stitch the new sequence.
distance_wait_for_visual: 5.0
visual_recovery_position_sigma: 0.10
visual_recovery_yaw_sigma: 3.0

distance_min_neighbors: 2
distance_min_factors: 20
distance_min_temporal_span: 1.0
distance_min_self_motion: 0.15
distance_max_condition_number: 10000.0
distance_max_normalized_rms: 3.5
distance_max_position_jump: 8.0

# These topics are generated by initial_pose_to_world.py using the measured
# initial positions supplied to merged_recovery.launch. Never use raw VIO here.
neighbor_names:
  - "omo3"
  - "omo4"
neighbor_pose_topics:
  - "/initial_world_pose/omo3"
  - "/initial_world_pose/omo4"
neighbor_pose_types:
  - "PoseStamped"
  - "PoseStamped"
neighbor_pose_suffix: "/global_pose"
